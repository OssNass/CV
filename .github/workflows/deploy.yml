name: Deploy multiple Slidev lectures with Yarn

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Yarn
        run: npm install -g yarn

      - name: Install dependencies
        run: |
          if [ -f "package.json" ]; then
            yarn install
          fi

      - name: Install Slidev CLI
        run: yarn global add @slidev/cli

      - name: Build all root-level .md files
        run: |
          mkdir -p dist
          for file in Lecture*.md; do
            [ -f "$file" ] || continue
            name=$(basename "$file" .md)
            echo "Building $file → dist/$name"
            slidev build "$file" \
              --out "dist/$name" \
              --base "/${{ github.event.repository.name }}/$name/"
          done

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
